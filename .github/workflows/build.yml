name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LUMEN_KEYSTORE_B64: ${{ secrets.LUMEN_KEYSTORE_B64 }}
      LUMEN_KEYSTORE_PASSWORD: ${{ secrets.LUMEN_KEYSTORE_PASSWORD }}
      LUMEN_KEY_ALIAS: ${{ secrets.LUMEN_KEY_ALIAS }}
      LUMEN_KEY_PASSWORD: ${{ secrets.LUMEN_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.1"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "lumen-horloge-v${{VERSION}}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-horloge-apk
          path: lumen-horloge-v*.apk
          if-no-files-found: error

      - name: Publish "latest" release (push on main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --repo "${{ github.repository }}" 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if gh release create latest "lumen-horloge-v${{ steps.version.outputs.VERSION }}.apk" \
              --title "Latest build" \
              --notes "APK le plus récent — build automatique du push sur main." \
              --repo "${{ github.repository }}"; then
              break
            fi
            echo "Échec création release (tentative $i/5), nouvel essai dans 10 s…"
            sleep 10
          done

      - name: Publish versioned release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "lumen-horloge-v${{ steps.version.outputs.VERSION }}.apk" \
            --title "$GITHUB_REF_NAME" \
            --notes "Build automatique — APK $GITHUB_REF_NAME." \
            --repo "${{ github.repository }}" \
            || gh release upload "$GITHUB_REF_NAME" "lumen-horloge-v${{ steps.version.outputs.VERSION }}.apk" \
               --clobber --repo "${{ github.repository }}"
